<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Página não encontrada | Leo Azevedo</title>
  <meta name="description" content="A página que você tentou acessar não foi encontrada.">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0b1220">
  <link rel="icon" type="image/png" href="/images/simbolo-leoazevedo.png">
  <link rel="apple-touch-icon" href="/images/simbolo-leoazevedo.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .error-page{min-height:100vh;display:grid;place-items:center;background:#0b1010;color:#f2efe8;padding:40px 20px}
    .error-inner{width:min(760px,100%);text-align:center}
    .error-code{display:block;font-family:var(--display);font-size:clamp(72px,18vw,180px);font-weight:800;line-height:.9;letter-spacing:-.06em;color:#b85c38}
    .error-page h1{margin:24px 0 14px;color:#f2efe8}
    .error-page p{max-width:560px;margin:0 auto 28px;color:#aaa99f}
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-inner">
      <span class="error-code">404</span>
      <h1>Essa página não existe.</h1>
      <p>O endereço pode ter mudado ou o link pode estar incorreto. Você pode voltar para o início e continuar por lá.</p>
      <a class="btn btn-primary btn-large" href="/">Voltar para o site</a>
    </div>
  </main>
</body>
</html>
